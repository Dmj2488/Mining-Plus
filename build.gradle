plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+'
}

version = '1.0.0'
group = 'com.example.heavymining'
base { archivesName = 'heavymining' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.77'
    mods {
        heavymining { sourceSet sourceSets.main }
    }
    runs {
        client { client() }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
